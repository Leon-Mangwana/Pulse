# Project-wide knobs. Every assumption lives here so it can be changed without touching code.

seed: 42                      # fixed random seed: same input must give the same output

data:
  start_date: 2024-11-01      # first day covered by the data (24 months to end_date)
  end_date: 2026-10-31        # last day covered by the data
  raw_dir: data/raw
  processed_dir: data/processed
  duckdb_path: data/processed/pulse.duckdb

synth:                        # synthetic data generator (src/pulse/synth.py)
  n_customers: 5000
  churn_rate: 0.15            # share of customers who churn inside the 24-month window (about 7.5% a year)
  closed_share_of_churn: 0.20 # of churners, share who formally close; the rest fade silently
  no_warning_share_of_churn: 0.12   # churners who vanish with no warning signs at all
  false_alarm_rate: 0.08      # non-churners who show warning signs and then recover
  job_change_rate: 0.10       # salaried non-churners whose salary payer changes
  lead_months_min: 2          # warning signs start 2 to 4 months before churn
  lead_months_max: 4
  savings_account_share: 0.30 # customers with a second (savings) account
  zig_per_usd_start: 26.5     # ZiG per USD in the first month
  zig_monthly_drift: 0.012    # ZiG weakens by this fraction per month
  monthly_service_fee_usd: 3.0
  segments:                   # mix of customer segments
    salaried: 0.45
    sme: 0.15
    informal: 0.30
    diaspora: 0.10

fx:
  zig_per_usd: 30.0           # one rate to express ZiG balances and flows in USD; replace with the bank's rate

target:                       # churn label (src/pulse/target.py)
  horizon_days: 90            # label window after the snapshot date
  silent_threshold: 0.20      # silent churn: activity AND balance fall below this share of own baseline
  baseline_months: 6          # months before the snapshot that define the customer's own baseline
  min_history_months: 6       # snapshots with less history than this are dropped
  inactive_min_txns_3m: 3     # fewer non-fee transactions than this in the 3 months before = already inactive, dropped

features:                     # feature families (src/pulse/features/)
  baseline_months: 6          # "change versus own baseline" compares the last month with the 6 before it
  cap_months: 12              # months-since counters are capped here
  salary_tolerance: 0.30      # a credit within +-30% of the reference amount counts as the same salary
  salary_min_usd: 50          # ignore "salaries" smaller than this
