# docker compose up  ->  api on http://localhost:8000 (docs at /docs), dashboard on http://localhost:8501
# Both services share ./data and ./models from the host, so a pipeline run on the host or in the
# container is visible to both.
services:
  api:
    build: .
    image: pulse:latest
    command: ["api"]
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 30s

  dashboard:
    image: pulse:latest
    command: ["dashboard"]
    ports:
      - "8501:8501"
    environment:
      PULSE_API_URL: http://api:8000
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      api:
        condition: service_healthy
