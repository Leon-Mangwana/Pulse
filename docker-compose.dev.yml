# Development override: mounts the source, config and tests into the containers so edits apply
# without a rebuild. Use it on top of the base file:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm api python -m pytest -q
services:
  api:
    volumes:
      - ./src:/app/src
      - ./api:/app/api
      - ./config:/app/config
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml
  dashboard:
    volumes:
      - ./src:/app/src
      - ./dashboard:/app/dashboard
      - ./config:/app/config
      - ./tests:/app/tests
      - ./.streamlit:/app/.streamlit
      - ./pyproject.toml:/app/pyproject.toml
